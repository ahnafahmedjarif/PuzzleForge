
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuzzleForge - Puzzle Arena</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #55d6a7;
  margin-bottom: 8px;
}

.subtitle {
  color: #aab7c4;
  margin-bottom: 25px;
}

.board {
  width: min(90vw, 480px);
  aspect-ratio: 1 / 1;
  margin: 20px auto;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  border: 4px solid #293744;
  border-radius: 5px;
  overflow: hidden;
}

.square {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(22px, 8vw, 48px);
}

.light {
  background: #e8e3d5;
}

.dark {
  background: #628b78;
}

.white-piece {
  color: #ffffff;
  text-shadow: 1px 2px 3px #222;
}

.black-piece {
  color: #172027;
  text-shadow: 1px 1px 2px #aaa;
}

.info {
  color: #c4ced8;
  margin-top: 20px;
}

button {
  background: #55d6a7;
  color: #102019;
  border: none;
  padding: 12px 25px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  margin-top: 15px;
}
</style>
</head>

<body>

<h1>♟ PuzzleForge</h1>
<p class="subtitle">Chess Puzzle Arena</p>

<div class="board">

<!-- Rank 8 -->
<div class="square light black-piece">♜</div>
<div class="square dark black-piece">♞</div>
<div class="square light black-piece">♝</div>
<div class="square dark black-piece">♛</div>
<div class="square light black-piece">♚</div>
<div class="square dark black-piece">♝</div>
<div class="square light black-piece">♞</div>
<div class="square dark black-piece">♜</div>

<!-- Rank 7 -->
<div class="square dark black-piece">♟</div>
<div class="square light black-piece">♟</div>
<div class="square dark black-piece">♟</div>
<div class="square light black-piece">♟</div>
<div class="square dark black-piece">♟</div>
<div class="square light black-piece">♟</div>
<div class="square dark black-piece">♟</div>
<div class="square light black-piece">♟</div>

<!-- Rank 6 -->
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>

<!-- Rank 5 -->
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>

<!-- Rank 4 -->
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>

<!-- Rank 3 -->
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>
<div class="square dark"></div>
<div class="square light"></div>

<!-- Rank 2 -->
<div class="square light white-piece">♙</div>
<div class="square dark white-piece">♙</div>
<div class="square light white-piece">♙</div>
<div class="square dark white-piece">♙</div>
<div class="square light white-piece">♙</div>
<div class="square dark white-piece">♙</div>
<div class="square light white-piece">♙</div>
<div class="square dark white-piece">♙</div>

<!-- Rank 1 -->
<div class="square dark white-piece">♖</div>
<div class="square light white-piece">♘</div>
<div class="square dark white-piece">♗</div>
<div class="square light white-piece">♕</div>
<div class="square dark white-piece">♔</div>
<div class="square light white-piece">♗</div>
<div class="square dark white-piece">♘</div>
<div class="square light white-piece">♖</div>

</div>

<p class="info">Welcome to PuzzleForge Chess Arena.</p>
<p class="info">Your chess puzzle board is ready!</p>

</body>
</html>
